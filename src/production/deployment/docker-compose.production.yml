version: '3.8'

services:
  # Main AIS Application
  ais-app:
    image: ais-production:${VERSION:-latest}
    container_name: ais-production-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - EVIDENCE_VALIDATION_ENABLED=true
      - HEALTH_CHECK_ENABLED=true
      - MONITORING_ENABLED=true
      - TRACING_ENABLED=true
      - PERFORMANCE_MONITORING=true

      # Database Configuration
      - DATABASE_URL=postgresql://ais_user:${DB_PASSWORD}@postgres:5432/ais_production
      - DATABASE_POOL_MIN=5
      - DATABASE_POOL_MAX=20
      - DATABASE_SSL=true

      # Redis Configuration
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CLUSTER_ENABLED=true
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      # Security
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_RATE_LIMIT=1000
      - CORS_ORIGIN=${CORS_ORIGIN}

      # Evidence Chain Configuration
      - EVIDENCE_CHAIN_TIMEOUT=300000
      - EVIDENCE_PARALLEL_EXECUTION=true
      - EVIDENCE_CONFIDENCE_THRESHOLD=85

      # Monitoring
      - PROMETHEUS_METRICS_ENABLED=true
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - ELASTICSEARCH_URL=http://elasticsearch:9200

      # External Services
      - EXTERNAL_API_TIMEOUT=30000
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}

    ports:
      - "3000:3000"
      - "9090:9090"  # Prometheus metrics
    volumes:
      - ./logs:/var/log/ais
      - ./artifacts:/app/artifacts
    depends_on:
      - postgres
      - redis
      - prometheus
      - jaeger
    networks:
      - ais-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # Load Balancer
  nginx:
    image: nginx:alpine
    container_name: ais-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - ais-app
    networks:
      - ais-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ais-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ais_production
      - POSTGRES_USER=ais_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/backups:/backups
    networks:
      - ais-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ais_user -d ais_production"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ais-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis.conf:ro
    networks:
      - ais-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: ais-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - ais-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: ais-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - ais-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Jaeger Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ais-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector
      - "14250:14250"  # gRPC
    depends_on:
      - elasticsearch
    networks:
      - ais-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:16686/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Elasticsearch for Logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: ais-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ais-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Kibana for Log Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    container_name: ais-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - ais-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Logstash for Log Processing
  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.0
    container_name: ais-logstash
    restart: unless-stopped
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/var/log/ais:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      - elasticsearch
    networks:
      - ais-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Evidence Chain Validator Service
  evidence-validator:
    image: ais-evidence-validator:${VERSION:-latest}
    container_name: ais-evidence-validator
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VALIDATION_TIMEOUT=300000
      - PARALLEL_EXECUTION=true
      - CONFIDENCE_THRESHOLD=85
      - DATABASE_URL=postgresql://ais_user:${DB_PASSWORD}@postgres:5432/ais_production
      - REDIS_URL=redis://redis:6379/1
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./evidence-artifacts:/app/artifacts
      - ./evidence-reports:/app/reports
    depends_on:
      - postgres
      - redis
    networks:
      - ais-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Production Deployment Orchestrator
  deployment-orchestrator:
    image: ais-deployment-orchestrator:${VERSION:-latest}
    container_name: ais-deployment-orchestrator
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DEPLOYMENT_TIMEOUT=1800000  # 30 minutes
      - AUTO_ROLLBACK_ENABLED=true
      - EVIDENCE_VALIDATION_REQUIRED=true
      - DATABASE_URL=postgresql://ais_user:${DB_PASSWORD}@postgres:5432/ais_production
      - KUBERNETES_CONFIG=/app/config/kubeconfig
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./kubernetes:/app/config
      - ./deployment-plans:/app/plans
    depends_on:
      - postgres
      - evidence-validator
    networks:
      - ais-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # File Server for Artifacts
  file-server:
    image: nginx:alpine
    container_name: ais-file-server
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./artifacts:/usr/share/nginx/html/artifacts:ro
      - ./reports:/usr/share/nginx/html/reports:ro
      - ./file-server/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ais-network

  # Health Check Service
  health-monitor:
    image: ais-health-monitor:${VERSION:-latest}
    container_name: ais-health-monitor
    restart: unless-stopped
    environment:
      - CHECK_INTERVAL=30000
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
      - PROMETHEUS_URL=http://prometheus:9090
    volumes:
      - ./health-checks:/app/config
    depends_on:
      - prometheus
    networks:
      - ais-network

  # Backup Service
  backup-service:
    image: ais-backup-service:${VERSION:-latest}
    container_name: ais-backup-service
    restart: unless-stopped
    environment:
      - BACKUP_SCHEDULE=0 2 * * *  # Daily at 2 AM
      - DATABASE_URL=postgresql://ais_user:${DB_PASSWORD}@postgres:5432/ais_production
      - S3_BUCKET=${BACKUP_S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - RETENTION_DAYS=30
    volumes:
      - ./backups:/app/backups
      - postgres_data:/data/postgres:ro
    depends_on:
      - postgres
    networks:
      - ais-network

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/redis
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/prometheus
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/grafana
  elasticsearch_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/elasticsearch

networks:
  ais-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16