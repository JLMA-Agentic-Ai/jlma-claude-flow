# Kubernetes deployment configuration for AIS Plugin
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ais-plugin
  namespace: claude-flow
  labels:
    app: ais-plugin
    version: v3.0.0-alpha.1
    component: immunity-system
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ais-plugin
  template:
    metadata:
      labels:
        app: ais-plugin
        version: v3.0.0-alpha.1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534  # nobody
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      # Service account for RBAC
      serviceAccountName: ais-plugin

      # Image pull secrets if using private registry
      imagePullSecrets:
        - name: claude-flow-registry

      containers:
        - name: ais-core
          image: claude-flow/agent-immunity:3.0.0-alpha.1
          imagePullPolicy: IfNotPresent

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL

          # Ports
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # Environment variables
          env:
            - name: NODE_ENV
              value: "production"
            - name: AIS_LOG_LEVEL
              value: "info"
            - name: AIS_HEALTH_PORT
              value: "8080"
            - name: AIS_METRICS_PORT
              value: "9090"
            - name: AIS_IMMUNITY_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: ais-config
                  key: immunity_threshold
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ais-config
                  key: redis_host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ais-secrets
                  key: redis_password

          # Resource limits and requests
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "100Mi"

          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: health
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /ready
              port: health
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # Startup probe for slow-starting applications
          startupProbe:
            httpGet:
              path: /health
              port: health
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          # Volume mounts
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: logs
              mountPath: /app/logs

      # Volumes
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: "100Mi"
        - name: config
          configMap:
            name: ais-config
        - name: logs
          emptyDir:
            sizeLimit: "1Gi"

      # Node selection and affinity
      nodeSelector:
        kubernetes.io/arch: amd64

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ais-plugin
                topologyKey: kubernetes.io/hostname

      # Tolerations for dedicated nodes
      tolerations:
        - key: "node-role.kubernetes.io/claude-flow"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      # DNS policy
      dnsPolicy: ClusterFirst

      # Restart policy
      restartPolicy: Always

---
# Service for AIS Plugin
apiVersion: v1
kind: Service
metadata:
  name: ais-plugin-service
  namespace: claude-flow
  labels:
    app: ais-plugin
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app: ais-plugin

---
# ConfigMap for AIS configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ais-config
  namespace: claude-flow
data:
  immunity_threshold: "0.8"
  redis_host: "ais-redis-service"
  log_level: "info"
  extended_immunities: "true"
  performance_target_ms: "30"

---
# Secret for sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: ais-secrets
  namespace: claude-flow
type: Opaque
data:
  # Base64 encoded values (replace with actual secrets)
  redis_password: YWlzLXNlY3VyZS1wYXNzd29yZA==  # ais-secure-password

---
# ServiceAccount for RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ais-plugin
  namespace: claude-flow
automountServiceAccountToken: false

---
# PodDisruptionBudget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ais-plugin-pdb
  namespace: claude-flow
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ais-plugin

---
# HorizontalPodAutoscaler for auto-scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ais-plugin-hpa
  namespace: claude-flow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ais-plugin
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: ais_response_time_ms
        target:
          type: AverageValue
          averageValue: "25"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60